// Skill vocabulary + helpers shared by the matcher and the chatbot.

// canonical skill -> aliases (all lowercase)
const SKILLS = {
  javascript: ['javascript', 'js', 'es6'],
  typescript: ['typescript', 'ts'],
  react: ['react', 'reactjs', 'react.js'],
  node: ['node', 'nodejs', 'node.js'],
  express: ['express', 'expressjs', 'express.js'],
  mongodb: ['mongodb', 'mongo', 'mongoose'],
  html: ['html', 'html5'],
  css: ['css', 'css3', 'tailwind', 'bootstrap'],
  python: ['python'],
  java: ['java'],
  cpp: ['c++', 'cpp'],
  c: ['c'],
  sql: ['sql', 'mysql', 'postgres', 'postgresql'],
  dsa: ['dsa', 'data structures', 'algorithms'],
  git: ['git', 'github'],
  docker: ['docker'],
  aws: ['aws'],
  'machine learning': ['machine learning', 'ml'],
  'data analysis': ['data analysis', 'pandas', 'excel', 'power bi', 'tableau'],
  django: ['django'],
  flask: ['flask'],
  spring: ['spring', 'spring boot'],
  android: ['android', 'kotlin'],
  testing: ['testing', 'jest', 'mocha', 'selenium', 'qa'],
  'rest api': ['rest', 'rest api', 'restful', 'api'],
};

const aliasToCanonical = new Map();
for (const [canon, aliases] of Object.entries(SKILLS)) {
  aliasToCanonical.set(canon, canon);
  for (const a of aliases) aliasToCanonical.set(a, canon);
}

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Pre-compile one regex per alias. Lookarounds instead of \b so "c++" and "node.js" work.
const aliasRegexes = [...aliasToCanonical.keys()].map((alias) => ({
  alias,
  canon: aliasToCanonical.get(alias),
  // "." in the lookbehind stops "node.js" from also matching the alias "js".
  re: new RegExp(`(?<![a-z0-9+#.])${escapeRegExp(alias)}(?![a-z0-9+#])`, 'i'),
}));

/** Canonicalise one skill tag ("ReactJS" -> "react"). Unknown tags are lower-cased and kept. */
function normalizeSkill(tag) {
  const t = String(tag || '').trim().toLowerCase();
  return aliasToCanonical.get(t) || t;
}

/** Find known skills mentioned in free text. */
function extractSkills(text) {
  const found = new Set();
  const s = String(text || '');
  for (const { canon, re } of aliasRegexes) if (re.test(s)) found.add(canon);
  // Single-letter "c" and generic "api" are noisy in prose; only keep them if clearly intended.
  if (found.has('c') && !/\b(c language|in c|c programming|\bc\b\s*,|, c\b)/i.test(s)) found.delete('c');
  return [...found];
}

module.exports = { SKILLS, normalizeSkill, extractSkills };

__defs["jobMatcher"]=function(module,exports){
// Rule-based job matching, in line with the report's "rule-based matching engine" (Sec. 3.1).
// Pure functions: no database access, so they are easy to unit-test.

const { normalizeSkill, extractSkills } = __require('./skills');

/**
 * Field names follow Table 4.1 of the project report. Fields the table does not list are optional:
 *   job.requiredSkills[]  - if absent, skills are extracted from title + description
 *   job.eligibility       - { minCgpa, branches[], maxBacklogs }
 *   student.backlogs      - number, defaults to 0
 */
function requiredSkillsOf(job) {
  if (Array.isArray(job.requiredSkills) && job.requiredSkills.length) {
    return [...new Set(job.requiredSkills.map(normalizeSkill))];
  }
  return extractSkills(`${job.title || ''} ${job.description || ''}`);
}

function checkEligibility(student, job, now = new Date()) {
  const reasons = [];
  const e = job.eligibility || {};
  if (job.deadline && new Date(job.deadline) < now) reasons.push('deadline passed');
  if (e.minCgpa != null && (student.cgpa ?? 0) < e.minCgpa) reasons.push(`needs CGPA ${e.minCgpa}+`);
  if (Array.isArray(e.branches) && e.branches.length) {
    const ok = e.branches.some((b) => String(b).toLowerCase() === String(student.branch || '').toLowerCase());
    if (!ok) reasons.push(`open to ${e.branches.join('/')} only`);
  }
  if (e.maxBacklogs != null && (student.backlogs ?? 0) > e.maxBacklogs) {
    reasons.push(`max ${e.maxBacklogs} backlogs allowed`);
  }
  return { eligible: reasons.length === 0, reasons };
}

/**
 * Rank jobs for a student.
 * score (0-100) = 80% skill overlap + 20% CGPA headroom. Jobs with no detectable skills get a neutral 50 skill score.
 * Returns { matches (eligible, sorted), ineligible (with reasons) }.
 */
function recommendJobs(student, jobs, { extraSkills = [], limit = 5, now = new Date() } = {}) {
  const mySkills = new Set([...(student.skills || []), ...extraSkills].map(normalizeSkill));
  const matches = [];
  const ineligible = [];

  for (const job of jobs) {
    const { eligible, reasons } = checkEligibility(student, job, now);
    const required = requiredSkillsOf(job);
    const matched = required.filter((s) => mySkills.has(s));
    const missing = required.filter((s) => !mySkills.has(s));

    if (!eligible) {
      ineligible.push({ job, reasons });
      continue;
    }

    const skillScore = required.length ? matched.length / required.length : 0.5;
    const minCgpa = job.eligibility?.minCgpa ?? 0;
    const headroom = Math.max(0, Math.min(1, ((student.cgpa ?? 0) - minCgpa) / 2));
    const score = Math.round((skillScore * 0.8 + headroom * 0.2) * 100);

    matches.push({ job, score, matched, missing });
  }

  matches.sort((a, b) => b.score - a.score || String(a.job.title).localeCompare(String(b.job.title)));
  return { matches: matches.slice(0, limit), allEligible: matches, ineligible };
}

/** Skills most often missing across the jobs the student is eligible for. */
function skillGaps(allEligible, topN = 5) {
  const count = new Map();
  for (const m of allEligible) for (const s of m.missing) count.set(s, (count.get(s) || 0) + 1);
  return [...count.entries()].sort((a, b) => b[1] - a[1]).slice(0, topN).map(([skill, jobs]) => ({ skill, jobs }));
}

module.exports = { recommendJobs, skillGaps, checkEligibility, requiredSkillsOf };

};

  ['roadmap', [[/\b(roadmap|study plan|prep(aration)? plan|schedule|timeline|how (do|should) i (prepare|start)|where (do|should) i start)\b/i, 4]]],
  ['mock_test', [[/\b(mock tests?|assessments?|timed test|score)\b/i, 3]]],
  ['technical', [[/\b(technical|coding|programming|dsa|oop|oops|dbms|os|cn|sql|javascript|react|node|python|java)\b/i, 2], [/\b(data structures?|algorithms?|operating systems?|networks?|database)\b/i, 2]]],
];

function detectIntent(message) {
  let best = { intent: 'fallback', score: 0 };
  for (const [intent, rules] of INTENTS) {
    const score = rules.reduce((sum, [re, w]) => sum + (re.test(message) ? w : 0), 0);
    if (score > best.score) best = { intent, score };
  }
  return best.score >= 2 ? best.intent : 'fallback';
}

function detectTopic(message) {
  const m = message.toLowerCase();
  for (const [topic, aliases] of Object.entries(kb.topicAliases)) {
    for (const a of aliases) {
      const re = new RegExp(`(?<![a-z0-9])${a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(?![a-z0-9])`);
      if (re.test(m)) return topic;
    }
  }
  return null;
}

// ---------- Helpers ----------
const pick = (arr, rng) => arr[Math.floor(rng() * arr.length)];
const allQuestions = () => [...Object.values(kb.technicalQuestions).flat(), ...kb.hrQuestions];
const findQuestion = (id) => allQuestions().find((q) => q.id === id);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

const DEFAULT_SUGGESTIONS = ['Recommend jobs for me', 'What skills am I missing?', 'Ask me a technical question', 'Resume tips', 'Make a study plan'];

const reply = (text, extra = {}) => ({ reply: text, suggestions: DEFAULT_SUGGESTIONS, ...extra });

// ---------- Handlers ----------
const handlers = {
  greeting: ({ student }) =>
    reply(`Hi${student?.name ? ` ${student.name.split(' ')[0]}` : ''}! I'm your placement assistant. I can recommend jobs that fit your profile, show your skill gaps, and help you practise aptitude, technical and HR rounds. What would you like to do?`),

  thanks: () => reply("You're welcome! Ask me anything else about your placement prep."),

  help: () =>
    reply('Here is what I can do:\n• Recommend jobs based on your skills, CGPA and branch\n• Show the skills you are missing for open jobs\n• Ask you technical or HR practice questions (try "ask me a DBMS question")\n• Aptitude tips (quant, logical, verbal)\n• Resume tips and a week-by-week study plan'),

  jobs: async ({ message, student, deps }) => {
    if (!student) return reply('I could not load your profile. Please log in again.');
    const jobs = await deps.getOpenJobs();
    if (!jobs.length) return reply('There are no open job postings right now. Check back soon!');

    const extraSkills = extractSkills(message); // "jobs for react and node" widens the search
    const { matches, ineligible } = recommendJobs(student, jobs, { extraSkills, limit: 5 });

    if (!matches.length) {
      const why = ineligible.slice(0, 3).map((i) => `• ${i.job.title}: ${i.reasons.join(', ')}`).join('\n');
      return reply(`I couldn't find open jobs you're currently eligible for.${why ? `\n\nClosest ones:\n${why}` : ''}\n\nTry improving your profile skills or ask "What skills am I missing?"`);
    }
    const top = matches[0];
    const intro = `I found ${matches.length} job${matches.length > 1 ? 's' : ''} that fit your profile. Best match: ${top.job.title}${top.job.company ? ` at ${top.job.company}` : ''} (${top.score}% match).`;
    return reply(intro, {
      jobs: matches.map((m) => ({
        id: String(m.job._id ?? m.job.jobId ?? ''),
        title: m.job.title,
        company: m.job.company || '',
        deadline: m.job.deadline || null,
        score: m.score,
        matchedSkills: m.matched,
        missingSkills: m.missing,
      })),
      suggestions: ['What skills am I missing?', 'Ask me a technical question', 'Resume tips'],
    });
  },

  skill_gap: async ({ student, deps }) => {
    if (!student) return reply('I could not load your profile. Please log in again.');
    const jobs = await deps.getOpenJobs();
    const { allEligible } = recommendJobs(student, jobs, { limit: 100 });
    const gaps = skillGaps(allEligible);
    if (!gaps.length) {
      return reply(student.skills?.length
        ? 'Nice, your skills already cover the open jobs you are eligible for. Keep practising interview questions!'
        : 'Your profile has no skills yet. Add your skills on your profile page and I can compare them with open jobs.');
    }
    const lines = gaps.map((g) => `• ${cap(g.skill)}: required by ${g.jobs} job${g.jobs > 1 ? 's' : ''} you are eligible for`);
    const practisable = gaps.find((g) => kb.technicalQuestions[detectTopic(g.skill)]);
    const tip = practisable ? `\n\nI can quiz you on ${cap(practisable.skill)}: try "ask me a ${practisable.skill} question".` : '\n\nStart with the first one and add it to your profile once you have practised it.';
    return reply(`Skills that would unlock the most jobs for you:\n${lines.join('\n')}${tip}`, {
      suggestions: [...(practisable ? [`Ask me a ${practisable.skill} question`] : []), 'Make a study plan', 'Recommend jobs for me'],
    });
  },

  practice: ({ message, rng }) => {
    const wantsHr = /\bhr\b|behavio(u)?ral/i.test(message);
    const topic = detectTopic(message);
    let pool;
    let label;
    if (wantsHr) { pool = kb.hrQuestions; label = 'HR'; }
    else if (topic && kb.technicalQuestions[topic]) { pool = kb.technicalQuestions[topic]; label = topic.toUpperCase(); }
    else { pool = Object.values(kb.technicalQuestions).flat(); label = 'Technical'; }
    const q = pick(pool, rng);
    return reply(`${label} question:\n\n${q.q}\n\nThink about it, then say "show answer" or "next question".`, {
      context: { lastQuestionId: q.id },
      suggestions: ['Show answer', 'Next question', 'Ask me an HR question'],
    });
  },

  show_answer: ({ context }) => {
    const q = context?.lastQuestionId && findQuestion(context.lastQuestionId);
    if (!q) return reply('Ask me for a practice question first, for example "ask me a DBMS question", and then I can show you the answer.');
    return reply(`Q: ${q.q}\n\nSample answer: ${q.a}`, { suggestions: ['Next question', 'Ask me an HR question', 'Recommend jobs for me'] });
  },

  hr: ({ rng }) => {
    const q = pick(kb.hrQuestions, rng);
    return reply(`HR rounds test communication and fit. Use the STAR method (Situation, Task, Action, Result) for behavioural questions. Try this one:\n\n${q.q}`, {
      context: { lastQuestionId: q.id },
      suggestions: ['Show answer', 'Next question', 'Resume tips'],
    });
  },

  technical: ({ message, rng }) => {
    const topic = detectTopic(message);
    if (!topic) return reply(`I can quiz you on: ${Object.keys(kb.technicalQuestions).map((t) => t.toUpperCase()).join(', ')}. Try "ask me a DSA question".`);
    const q = pick(kb.technicalQuestions[topic], rng);
    return reply(`${topic.toUpperCase()} practice:\n\n${q.q}\n\nSay "show answer" when ready.`, {
      context: { lastQuestionId: q.id },
      suggestions: ['Show answer', 'Next question', 'Recommend jobs for me'],
    });
  },

  aptitude: ({ message }) => {
    const m = message.toLowerCase();
    const key = /quant|maths?/.test(m) ? 'quant' : /logic|reason/.test(m) ? 'logical' : /verbal|english/.test(m) ? 'verbal' : 'general';
    return reply(`${kb.aptitudeTips[key]}\n\nYou can also take a timed mock test from the Assessments section of the portal.`, {
      suggestions: ['Quant tips', 'Logical reasoning tips', 'Verbal tips', 'Make a study plan'],
    });
  },

  resume: () => reply(`Resume checklist:\n${kb.resumeTips.map((t) => `• ${t}`).join('\n')}`, { suggestions: ['Recommend jobs for me', 'Ask me an HR question'] }),

  roadmap: () => reply(`A simple 8-week placement plan:\n${kb.roadmaps.default.map((t) => `• ${t}`).join('\n')}`, { suggestions: ['Aptitude tips', 'Ask me a DSA question', 'Resume tips'] }),

  mock_test: () => reply('Open the Assessments section on the portal to take timed aptitude and technical mock tests. They are auto-scored, so review every wrong answer afterwards. Want tips for a section?', { suggestions: ['Quant tips', 'Logical reasoning tips', 'Verbal tips'] }),

  fallback: () => reply("I'm not sure I understood that. I can help with job recommendations, skill gaps, practice questions, aptitude, resume tips and study plans. Try one of the options below."),
};

// ---------- Public API ----------
/**
 * @param {object} args
 * @param {string} args.message
 * @param {object} [args.context]   echoed back by the client, e.g. { lastQuestionId }
 * @param {string} args.userId
 * @param {object} args.deps        { getStudent(userId), getOpenJobs(), llmFallback?(message, student) }
 * @param {Function} [args.rng]     injectable for tests
 */
async function handleMessage({ message, context = {}, userId, deps, rng = Math.random }) {
  const text = String(message || '').trim().slice(0, 500);
  if (!text) return reply('Please type a message.');

  const intent = detectIntent(text);
  const student = intent === 'jobs' || intent === 'skill_gap' || intent === 'greeting' ? await deps.getStudent(userId) : null;

  // Optional AI fallback for open-ended questions the rules do not cover.
  if (intent === 'fallback' && deps.llmFallback) {
    try {
      const answer = await deps.llmFallback(text);
      if (answer) return reply(answer);
    } catch (err) {
      console.error('LLM fallback failed:', err.message);
    }
  }

  const out = await handlers[intent]({ message: text, context, student, deps, rng });
  return { ...out, intent };
}

module.exports = { handleMessage, detectIntent, detectTopic };

};

</script>
<script>
(function(){
  const { handleMessage } = __require('chatbot.service');
  const day = 864e5, now = Date.now();
  const J = (id,title,company,description,days,eligibility,requiredSkills)=>({_id:id,title,company,description,deadline:new Date(now+days*day).toISOString(),eligibility,requiredSkills});
  const JOBS = [
    J('j1','Frontend Developer','Pixelforge','Build UIs with React, JavaScript, HTML and CSS.',12,{minCgpa:7,branches:['IT','CSE']}),
    J('j2','Full Stack Engineer','Orbit Labs','React, Node.js, Express and MongoDB for internal tools.',9,{minCgpa:7.5}),
    J('j3','Backend Developer','Kite Systems','Node.js, Express, MongoDB and REST API design.',15,{minCgpa:7}),
    J('j4','Data Analyst','Numera','SQL, Python, Excel and Power BI dashboards.',20,{minCgpa:7.5}),
    J('j5','Java Developer Trainee','Stackwell','Java, Spring Boot, SQL and Git.',7,{minCgpa:6.5,maxBacklogs:0}),
    J('j6','ML Engineer Intern','Tensora','Python, machine learning and SQL.',18,{minCgpa:8.5,branches:['IT','CSE']}),
    J('j7','QA Automation Engineer','Verity','Testing with Selenium, JavaScript and Git.',10,{minCgpa:6.5}),
    J('j8','Embedded Systems Trainee','Circuita','C, C++ and microcontrollers.',14,{minCgpa:7,branches:['ECE']}),
  ];
  document.getElementById('joblist').innerHTML = JOBS.map(j=>`<li><b>${j.title}</b> · ${j.company}</li>`).join('');

  const $ = id => document.getElementById(id);
  const msgs=$('msgs'), chips=$('chips'), input=$('input'), send=$('send');
  const profile = () => ({
    name:$('name').value.trim()||'Student', branch:$('branch').value, cgpa:parseFloat($('cgpa').value)||0,
    backlogs:parseInt($('backlogs').value,10)||0, skills:$('skills').value.split(',').map(s=>s.trim()).filter(Boolean),
  });
  const deps = { getStudent: async()=>profile(), getOpenJobs: async()=>JOBS };
  let context = {};
  let history = [];   // last turns, sent to the server so the AI remembers the chat
  let serverOk = true; // falls back to the in-browser rules if the server is unreachable

  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function add(from, text, jobs){
    const d=document.createElement('div'); d.className='msg '+from;
    let html = esc(text);
    if(jobs) html += jobs.map(j=>`<div class="job"><div class="job-top"><strong>${esc(j.title)}</strong><span class="score">${j.score}%</span></div>
      <div class="muted">${esc(j.company)}${j.deadline?' · apply by '+new Date(j.deadline).toLocaleDateString():''}</div>
      <div class="tags">${j.matchedSkills.map(s=>`<span class="tag ok">${esc(s)}</span>`).join('')}${j.missingSkills.map(s=>`<span class="tag miss">${esc(s)}</span>`).join('')}</div></div>`).join('')
      + (jobs.length?`<div class="muted" style="margin-top:8px">Green: skills you have. Red: skills you are missing.</div>`:'');
    d.innerHTML=html; msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;
  }
  function setChips(list){ chips.innerHTML=''; (list||[]).forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=()=>ask(s);chips.appendChild(b);}); }
  function setMode(m){
    const el = $('mode');
    el.textContent = m === 'ai' ? 'AI answer (Claude)' : m === true ? 'Server rules (job cards, quiz)' : 'Offline: in-browser rules only';
  }
  async function ask(text){
    text=(text||'').trim(); if(!text) return;
    input.value=''; add('user',text); send.disabled=true;
    try{
      let r;
      if (serverOk) {
        try {
          const res = await fetch('/api/chatbot/message', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({message:text, context, history: history.slice(-10), profile: profile()}),
          });
          if (!res.ok) throw new Error('HTTP '+res.status);
          r = await res.json();
        } catch (e) { serverOk = false; setMode(false); }
      }
      if (!r) r = await handleMessage({message:text,context,userId:'demo',deps});
      context = r.context || {};
      if (serverOk) setMode(r.intent === 'llm' ? 'ai' : true);
      history.push({role:'user',content:text},{role:'assistant',content:r.reply});
      add('bot', r.reply, r.jobs); setChips(r.suggestions);
    }catch(e){ add('bot','Something went wrong. Please try again.'); }
    send.disabled=false; input.focus();
  }
  $('form').addEventListener('submit',e=>{e.preventDefault();ask(input.value);});
  const first = {reply:"Hi! I'm your placement assistant. I can recommend jobs that fit your profile, show skill gaps, and run interview practice.", suggestions:['Recommend jobs for me','What skills am I missing?','Ask me a DBMS question','Resume tips','Make a study plan']};
  add('bot',first.reply); setChips(first.suggestions);
})();
</script>
